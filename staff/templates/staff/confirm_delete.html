{% extends 'base.html' %}

{% block title %}Confirm Delete - KPN{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-md p-8 text-center">
        <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fas fa-exclamation-triangle text-2xl"></i>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">{{ title|default:"Confirm Deletion" }}</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">
            Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.
        </p>
        
        <form method="post" class="flex justify-center gap-4">
            {% csrf_token %}
            <a href="{% if cancel_url %}{% url cancel_url %}{% else %}javascript:history.back(){% endif %}" 
               class="px-6 py-2 border border-gray-300 text-gray-700 dark:border-gray-600 dark:text-gray-300 rounded hover:bg-gray-50 dark:hover:bg-gray-700 transition">
                Cancel
            </a>
            <button type="submit" class="px-6 py-2 bg-red-600 text-white rounded hover:bg-red-700 shadow transition">
                Yes, Delete
            </button>
        </form>
    </div>
</div>
{% endblock %}
