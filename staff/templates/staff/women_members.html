{% extends 'base.html' %}{% block title %}Women Members - KPN{% endblock %}{% block content %}<section class="max-w-6xl mx-auto px-4 py-8"><h1 class="text-2xl font-bold">Women Members</h1><p>{{ total_count }} verified members</p><form method="get" class="my-4"><input name="search" value="{{ search }}" placeholder="Search"><select name="zone"><option value="">All zones</option>{% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}</select><button>Filter</button></form>{% for member in female_members %}<div class="border-b py-3"><b>{{ member.get_full_name }}</b><br><small>{{ member.get_jurisdiction }}</small></div>{% empty %}<p>No members found.</p>{% endfor %}</section>{% endblock %}
