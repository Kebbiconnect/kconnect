{% extends 'base.html' %}

{% block title %}Login - KPN{% endblock %}

{% block extra_css %}
<style>
    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes float {
        0%, 100% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-20px);
        }
    }
    
    @keyframes pulse {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0.5;
        }
    }
    
    @keyframes slideInRight {
        from {
            opacity: 0;
            transform: translateX(100px);
        }
        to {
            opacity: 1;
            transform: translateX(0);
        }
    }
    
    .animate-fadeInUp {
        animation: fadeInUp 0.8s ease-out;
    }
    
    .animate-float {
        animation: float 3s ease-in-out infinite;
    }
    
    .animate-pulse-slow {
        animation: pulse 2s ease-in-out infinite;
    }
    
    .animate-slideInRight {
        animation: slideInRight 0.6s ease-out;
    }
    
    .gradient-bg {
        background: linear-gradient(135deg, #28a745 0%, #0066cc 100%);
    }
    
    .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .dark .glass-effect {
        background: rgba(31, 41, 55, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .input-glow:focus {
        box-shadow: 0 0 20px rgba(40, 167, 69, 0.4);
        border-color: #28a745;
    }
    
    .dark .input-glow:focus {
        box-shadow: 0 0 20px rgba(40, 167, 69, 0.6);
    }
</style>
{% endblock %}

{% block content %}
<div class="py-16 px-4 sm:px-6 lg:px-8 bg-gray-50 dark:bg-gray-900 min-h-[80vh] flex items-center justify-center relative overflow-hidden">
    <!-- Decorative blobs -->
    <div class="absolute top-0 left-1/4 w-72 h-72 bg-kpn-green rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-blob"></div>
    <div class="absolute top-0 right-1/4 w-72 h-72 bg-kpn-blue rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-1/3 w-72 h-72 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 dark:opacity-10 animate-blob animation-delay-4000"></div>

    <div class="max-w-md w-full relative z-10 animate-fadeInUp">
        <div class="text-center mb-8">
            <div class="mx-auto w-20 h-20 bg-white dark:bg-gray-800 rounded-full flex items-center justify-center shadow-lg border border-gray-100 dark:border-gray-700 mb-6">
                <i class="fas fa-shield-alt text-kpn-green text-3xl"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white">
                Welcome Back
            </h2>
            <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                Sign in to your KPN account to continue
            </p>
        </div>
        
        <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 border border-gray-100 dark:border-gray-700">
            <form method="POST" class="space-y-6">
                {% csrf_token %}
                
                <div class="space-y-2">
                    <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">
                        Username
                    </label>
                    <div class="relative">
                        <input type="text" 
                               name="username" 
                               required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-kpn-green focus:border-transparent transition-all duration-300 pl-11"
                               placeholder="Enter your username">
                        <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                    </div>
                </div>
                
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="block text-sm font-semibold text-gray-700 dark:text-gray-300">
                            Password
                        </label>
                        <a href="{% url 'staff:forgot_password' %}" class="text-xs text-kpn-green hover:text-kpn-blue font-semibold transition-colors">
                            Forgot Password?
                        </a>
                    </div>
                    <div class="relative">
                        <input type="password" 
                               name="password" 
                               id="loginPassword"
                               required 
                               class="w-full px-4 py-3 border border-gray-300 rounded-lg dark:bg-gray-700 dark:border-gray-600 dark:text-white focus:outline-none focus:ring-2 focus:ring-kpn-green focus:border-transparent transition-all duration-300 pl-11 pr-11"
                               placeholder="Enter your password">
                        <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                        <button type="button" onclick="toggleLoginPassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-kpn-green transition-colors focus:outline-none">
                            <i class="fas fa-eye" id="loginPasswordIcon"></i>
                        </button>
                    </div>
                </div>
                
                <div class="pt-2">
                    <button type="submit" 
                            class="w-full flex justify-center items-center py-3 px-4 border border-transparent text-base font-bold rounded-lg text-white bg-kpn-green hover:bg-green-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-kpn-green transform transition-all duration-300 hover:shadow-lg">
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Sign In
                    </button>
                </div>
            </form>
            
            <div class="text-center pt-6 mt-6 border-t border-gray-100 dark:border-gray-700">
                <p class="text-sm text-gray-600 dark:text-gray-400">
                    Don't have an account? 
                    <a href="{% url 'staff:register' %}" 
                       class="font-bold text-kpn-blue hover:text-blue-700 transition-colors duration-300">
                        Join KPN Today
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
// Password visibility toggle function
function toggleLoginPassword() {
    const passwordField = document.getElementById('loginPassword');
    const icon = document.getElementById('loginPasswordIcon');
    
    if (passwordField.type === 'password') {
        passwordField.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        passwordField.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
