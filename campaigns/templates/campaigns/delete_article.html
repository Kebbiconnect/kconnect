{% extends 'base.html' %}
{% block title %}Delete Article - KPN Newsroom{% endblock %}
{% block content %}
<div class="bg-gray-50 dark:bg-gray-900 min-h-screen py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow border border-gray-200 dark:border-gray-700 p-8">
            <div class="flex items-center mb-6">
                <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mr-4">
                    <i class="fas fa-trash text-red-600 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Delete Article</h1>
                    <p class="text-gray-500 text-sm">This action cannot be undone.</p>
                </div>
            </div>
            <div class="bg-gray-50 dark:bg-gray-700 rounded-lg p-5 mb-6 border border-gray-200 dark:border-gray-600">
                <h2 class="text-base font-semibold text-gray-900 dark:text-white">{{ article.title }}</h2>
                <p class="text-gray-500 text-xs mt-1">Draft &bull; Created {{ article.created_at|date:"M d, Y" }}</p>
            </div>
            <div class="flex justify-end gap-3">
                <a href="{% url 'campaigns:my_articles' %}" class="px-5 py-2.5 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-200 transition font-medium">Cancel</a>
                <form method="POST" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="px-5 py-2.5 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-bold">
                        <i class="fas fa-trash mr-2"></i> Delete Article
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
