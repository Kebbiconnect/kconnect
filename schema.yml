    WomensProgram:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        description:
          type: string
        program_type:
          $ref: '#/components/schemas/ProgramTypeEnum'
        status:
          $ref: '#/components/schemas/WomensProgramStatusEnum'
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        location:
          type: string
          maxLength: 200
        target_participants:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Expected number of participants
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
