      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementList'
          description: ''
  /api/v1/articles/{id}/decision/:
    post:
      operationId: articles_decision_create
      description: REVIEW_ARTICLES required. Pending articles only. Return/reject
        requires an editor note.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - articles
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum:
                  - publish
                  - return
                  - reject
                note:
                  type: string
              required:
              - action
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/articles/{id}/submit/:
    post:
      operationId: articles_submit_create
      description: Owner's nonempty DRAFT only. Returned articles must be edited/saved
        to DRAFT before submitting again.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - articles
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
  /api/v1/articles/images/:
    post:
      operationId: articles_images_create
      description: Verified WRITE_ARTICLES members only. Multipart JPG/PNG/GIF/WebP
        image; max 2 MB and 4000px per dimension. Returns Editor.js-compatible storage
        URL.
      tags:
      - articles
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
              required:
              - image
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: integer
                  file:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
          description: ''
