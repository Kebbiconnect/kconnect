openapi: 3.0.3
info:
  title: KPN API
  version: 1.0.0
  description: KPN Mobile App API
paths:
  /api/v1/advocacy/:
    get:
      operationId: advocacy_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - advocacy
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                - results
                properties:
                  count:
                    type: integer
                    example: 123
                  next:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=4
                  previous:
                    type: string
                    nullable: true
                    format: uri
                    example: http://api.example.org/accounts/?page=2
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/advocacy/{id}/:
    get:
      operationId: advocacy_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - advocacy
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdvocacyCampaign'
          description: ''
  /api/v1/announcements/:
    get:
      operationId: announcements_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
