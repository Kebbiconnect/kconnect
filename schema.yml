          application/json:
            schema:
              type: object
              properties:
                uid:
                  type: string
                token:
                  type: string
                new_password:
                  type: string
                  format: password
                  writeOnly: true
              required:
              - uid
              - token
              - new_password
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
