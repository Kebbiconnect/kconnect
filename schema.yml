components:
  schemas:
    ActionTypeEnum:
      enum:
      - WARNING
      - SUSPENSION
      - DISMISSAL
      type: string
      description: |-
        * `WARNING` - Warning
        * `SUSPENSION` - Suspension
        * `DISMISSAL` - Dismissal
    AdvocacyCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        issue:
          type: string
          description: What is the core issue?
        background:
          type: string
          description: Background context
        kpn_position:
          type: string
          description: KPN's official position
        actions_taken:
          type: string
          description: What actions have been taken?
        government_response:
          type: string
        outcome:
          type: string
        is_active:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - background
      - created_at
      - id
      - issue
      - title
      - updated_at
    BlankEnum:
      enum:
      - ''
    Campaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 350
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 300
        subheadline:
          type: string
          description: Short deck/subheadline that appears below the main headline
          maxLength: 500
        category:
          $ref: '#/components/schemas/CampaignCategoryEnum'
        location:
          type: string
          description: Specific community or location (e.g. Birnin Kebbi)
          maxLength: 200
        lga:
          type: integer
          nullable: true
        lga_name:
          type: string
          readOnly: true
          nullable: true
        ward:
          type: integer
          nullable: true
        ward_name:
          type: string
          readOnly: true
          nullable: true
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        reporter_credit:
          $ref: '#/components/schemas/ReporterCreditEnum'
        author_name:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          readOnly: true
        content:
          type: string
        content_json:
          nullable: true
          description: Block editor content stored as JSON
        views:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        read_time:
          type: integer
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
      required:
      - author_name
      - id
      - image
      - lga_name
      - read_time
      - slug
      - title
      - ward_name
    CampaignCategoryEnum:
      enum:
      - COMMUNITY
      - EDUCATION
      - AGRICULTURE
      - HEALTH
      - SECURITY
      - INFRASTRUCTURE
      - MARKETS
      - YOUTH
      - WOMEN
      - ENVIRONMENT
      - HUMAN_INTEREST
      - CULTURE
      - TRADITIONAL
      - GOVERNANCE
      - EMERGENCY
      - CIVIC
      - GENERAL
      type: string
      description: |-
        * `COMMUNITY` - Community
        * `EDUCATION` - Education
        * `AGRICULTURE` - Agriculture
        * `HEALTH` - Health
        * `SECURITY` - Security
        * `INFRASTRUCTURE` - Infrastructure
        * `MARKETS` - Markets & Business
        * `YOUTH` - Youth
        * `WOMEN` - Women
        * `ENVIRONMENT` - Environment
        * `HUMAN_INTEREST` - Human Interest
        * `CULTURE` - Culture
        * `TRADITIONAL` - Traditional Institutions
        * `GOVERNANCE` - Government & Governance
        * `EMERGENCY` - Emergency
        * `CIVIC` - Civic
        * `GENERAL` - General
    CampaignStatusEnum:
      enum:
      - DRAFT
      - PENDING
      - PUBLISHED
      - REJECTED
      - ARCHIVED
