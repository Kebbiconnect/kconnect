components:
  schemas:
    ActionTypeEnum:
      enum:
      - WARNING
      - SUSPENSION
      - DISMISSAL
      type: string
      description: |-
        * `WARNING` - Warning
        * `SUSPENSION` - Suspension
        * `DISMISSAL` - Dismissal
    AdvocacyCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        issue:
          type: string
          description: What is the core issue?
        background:
          type: string
          description: Background context
        kpn_position:
          type: string
          description: KPN's official position
        actions_taken:
          type: string
          description: What actions have been taken?
        government_response:
          type: string
        outcome:
          type: string
        is_active:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - background
      - created_at
      - id
      - issue
      - title
      - updated_at
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Brief title for the announcement
          maxLength: 200
        content:
          type: string
          description: Announcement message
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            Who should receive this announcement

            * `GENERAL` - General - All KPN Members
            * `ZONAL` - Zonal - Specific Zone
            * `LGA` - LGA - Specific LGA
            * `WARD` - Ward - Specific Ward
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        target_zone:
          type: integer
          nullable: true
          description: Required for ZONAL scope - all LGAs in this zone will receive
            the announcement
        target_lga:
          type: integer
          nullable: true
          description: Required for LGA scope
        target_ward:
          type: integer
          nullable: true
          description: Required for WARD scope
        is_active:
          type: boolean
          description: Only active announcements are shown to users
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration date (announcement will auto-deactivate)
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - created_by
      - id
      - scope
      - title
      - updated_at
    ArticleWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        subheadline:
          type: string
          description: Short deck/subheadline that appears below the main headline
          maxLength: 500
        category:
          $ref: '#/components/schemas/Category867Enum'
        location:
          type: string
          description: Specific community or location (e.g. Birnin Kebbi)
          maxLength: 200
        lga:
          type: integer
          nullable: true
        ward:
          type: integer
          nullable: true
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        reporter_credit:
          $ref: '#/components/schemas/ReporterCreditEnum'
        content:
          type: string
        content_json:
          nullable: true
          description: Block editor content stored as JSON
        featured_image:
          type: string
          format: uri
          nullable: true
      required:
      - id
      - title
    AuditReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        audit_period:
          type: string
          description: e.g., 'Q1 2025' or 'January-March 2025'
          maxLength: 100
        findings:
          type: string
          description: Key findings from the audit
        recommendations:
          type: string
          description: Recommendations for improvement
        compliance_status:
          type: string
          description: Overall compliance status
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/AuditReportStatusEnum'
          readOnly: true
        report_file:
          type: string
          format: uri
          nullable: true
          description: Upload detailed audit report PDF
        submitted_by:
          type: integer
          readOnly: true
          nullable: true
        submitted_to:
          type: integer
          readOnly: true
          nullable: true
          description: Usually the President
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        review_notes:
          type: string
          description: Notes from the reviewer
        created_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - audit_period
      - created_at
      - findings
      - id
      - recommendations
      - reviewed_at
      - reviewed_by
      - status
      - submitted_at
      - submitted_by
      - submitted_to
      - title
    AuditReportStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - REVIEWED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted
        * `REVIEWED` - Reviewed
    BlankEnum:
      enum:
      - ''
    Campaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          maxLength: 350
          pattern: ^[-a-zA-Z0-9_]+$
        title:
          type: string
          maxLength: 300
        subheadline:
          type: string
          description: Short deck/subheadline that appears below the main headline
          maxLength: 500
        category:
          $ref: '#/components/schemas/Category867Enum'
        category_label:
          type: string
          readOnly: true
        location:
          type: string
          description: Specific community or location (e.g. Birnin Kebbi)
          maxLength: 200
        lga:
          type: integer
          nullable: true
        lga_name:
          type: string
          readOnly: true
          nullable: true
        ward:
          type: integer
          nullable: true
        ward_name:
          type: string
          readOnly: true
          nullable: true
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        verification_status_label:
          type: string
          readOnly: true
        reporter_credit:
          $ref: '#/components/schemas/ReporterCreditEnum'
        author_name:
          type: string
          readOnly: true
        image:
          type: string
          format: uri
          nullable: true
          readOnly: true
        content:
          type: string
        content_json:
          nullable: true
          description: Block editor content stored as JSON
        views:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        read_time:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/CampaignStatusEnum'
      required:
      - author_name
      - category_label
      - id
      - image
      - lga_name
      - read_time
      - slug
      - title
      - verification_status_label
      - ward_name
    CampaignStatusEnum:
      enum:
      - DRAFT
