          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        email:
          type: string
          format: email
          title: Email address
          maxLength: 254
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
        phone:
          type: string
          maxLength: 20
        bio:
          type: string
        photo:
          type: string
          format: uri
          nullable: true
        gender:
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        role:
          $ref: '#/components/schemas/RoleEnum'
        zone:
          type: integer
          nullable: true
        lga:
          type: integer
          nullable: true
        ward:
          type: integer
          nullable: true
        role_definition:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/UserStatusEnum'
        reporter_level:
          $ref: '#/components/schemas/ReporterLevelEnum'
        is_trusted_reporter:
          type: boolean
          description: Manually granted by President or Director of Media & Communications
        telegram_membership:
          allOf:
          - $ref: '#/components/schemas/TelegramMembership'
          readOnly: true
          nullable: true
      required:
      - id
      - phone
      - telegram_membership
      - username
