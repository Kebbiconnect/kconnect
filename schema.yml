components:
  schemas:
    ActionTypeEnum:
      enum:
      - WARNING
      - SUSPENSION
      - DISMISSAL
      type: string
      description: |-
        * `WARNING` - Warning
        * `SUSPENSION` - Suspension
        * `DISMISSAL` - Dismissal
    AdvocacyCampaign:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        issue:
          type: string
          description: What is the core issue?
        background:
          type: string
          description: Background context
        kpn_position:
          type: string
          description: KPN's official position
        actions_taken:
          type: string
          description: What actions have been taken?
        government_response:
          type: string
        outcome:
          type: string
        is_active:
          type: boolean
        image:
          type: string
          format: uri
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - background
      - created_at
      - id
      - issue
      - title
      - updated_at
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          description: Brief title for the announcement
          maxLength: 200
        content:
          type: string
          description: Announcement message
        scope:
          allOf:
          - $ref: '#/components/schemas/ScopeEnum'
          description: |-
            Who should receive this announcement

            * `GENERAL` - General - All KPN Members
            * `ZONAL` - Zonal - Specific Zone
            * `LGA` - LGA - Specific LGA
            * `WARD` - Ward - Specific Ward
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        target_zone:
          type: integer
          nullable: true
          description: Required for ZONAL scope - all LGAs in this zone will receive
            the announcement
        target_lga:
          type: integer
          nullable: true
          description: Required for LGA scope
        target_ward:
          type: integer
          nullable: true
          description: Required for WARD scope
        is_active:
          type: boolean
          description: Only active announcements are shown to users
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Optional expiration date (announcement will auto-deactivate)
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content
      - created_at
      - created_by
      - id
      - scope
      - title
      - updated_at
    ArticleStatusEnum:
      enum:
      - DRAFT
      - PENDING
      - PUBLISHED
      - REJECTED
      - ARCHIVED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING` - Pending Review
        * `PUBLISHED` - Published
        * `REJECTED` - Returned for Revision
        * `ARCHIVED` - Archived
    ArticleWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          allOf:
          - $ref: '#/components/schemas/ArticleStatusEnum'
          readOnly: true
        rejection_note:
          type: string
          readOnly: true
          description: Note from editor when returning article for revision
        title:
          type: string
          maxLength: 300
        subheadline:
          type: string
          description: Short deck/subheadline that appears below the main headline
          maxLength: 500
        category:
          $ref: '#/components/schemas/NewsCategoryEnum'
        location:
          type: string
          description: Specific community or location (e.g. Birnin Kebbi)
          maxLength: 200
        lga:
          type: integer
          nullable: true
        ward:
          type: integer
          nullable: true
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        reporter_credit:
          $ref: '#/components/schemas/ReporterCreditEnum'
        content:
          type: string
        content_json:
          nullable: true
          description: Block editor content stored as JSON
        featured_image:
          type: string
          format: uri
          nullable: true
        meta_description:
          type: string
          description: Short summary for search engines (max 160 characters)
          maxLength: 160
      required:
      - id
      - rejection_note
      - slug
      - status
      - title
    AuditReport:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        audit_period:
          type: string
          description: e.g., 'Q1 2025' or 'January-March 2025'
          maxLength: 100
        findings:
          type: string
          description: Key findings from the audit
        recommendations:
          type: string
          description: Recommendations for improvement
        compliance_status:
          type: string
          description: Overall compliance status
          maxLength: 200
        status:
          allOf:
          - $ref: '#/components/schemas/AuditReportStatusEnum'
          readOnly: true
        report_file:
          type: string
          format: uri
          nullable: true
          description: Upload detailed audit report PDF
        submitted_by:
          type: integer
          readOnly: true
          nullable: true
        submitted_to:
          type: integer
          readOnly: true
          nullable: true
          description: Usually the President
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        review_notes:
          type: string
          description: Notes from the reviewer
        created_at:
          type: string
