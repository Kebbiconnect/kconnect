      - review_notes
      - reviewed_at
      - reviewed_by
      - status
      - submitted_at
      - submitted_by
      - submitted_by_name
      - submitted_to
      - submitted_to_name
      - title
    ReportStatusEnum:
      enum:
      - DRAFT
      - SUBMITTED
      - UNDER_REVIEW
      - APPROVED
      - FLAGGED
      - REJECTED
      - ESCALATED
