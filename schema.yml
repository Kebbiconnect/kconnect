        deadline:
          type: string
          format: date
          nullable: true
          description: Deadline for report submission
        created_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        escalated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
