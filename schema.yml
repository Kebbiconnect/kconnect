      description: |-
        * `DRAFT` - Draft
        * `SUBMITTED` - Submitted
        * `UNDER_REVIEW` - Under Review
        * `APPROVED` - Approved
        * `FLAGGED` - Flagged for Issues
        * `REJECTED` - Rejected
        * `ESCALATED` - Escalated to Next Level
    ReportSubmit:
      type: object
      properties:
        title:
          type: string
          maxLength: 300
        content:
          type: string
        period:
          type: string
        deadline:
          type: string
          format: date
          nullable: true
        report_type:
          $ref: '#/components/schemas/ReportTypeEnum'
      required:
      - content
      - title
    ReportTypeEnum:
      enum:
      - WARD_TO_LGA
      - LGA_TO_ZONAL
      - ZONAL_TO_STATE
      type: string
      description: |-
        * `WARD_TO_LGA` - Ward to LGA Report
        * `LGA_TO_ZONAL` - LGA to Zonal Report
        * `ZONAL_TO_STATE` - Zonal to State Report
    ReporterCreditEnum:
      enum:
      - KPN_REPORTER
      - KPN_CORRESPONDENT
      - KPN_LGA
      - KPN_STATE
      - KPN_EDITORIAL
      type: string
      description: |-
        * `KPN_REPORTER` - KPN Community Reporter
        * `KPN_CORRESPONDENT` - KPN Ward Correspondent
        * `KPN_LGA` - KPN LGA Network Team
        * `KPN_STATE` - KPN State Team
        * `KPN_EDITORIAL` - KPN Editorial Team
    ReporterLevelEnum:
      enum:
      - MEMBER
      - COMMUNITY_REPORTER
      - TRUSTED_REPORTER
      type: string
      description: |-
        * `MEMBER` - Member
        * `COMMUNITY_REPORTER` - Community Reporter
        * `TRUSTED_REPORTER` - Trusted Reporter
    RoleDefinition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        tier:
          $ref: '#/components/schemas/TierEnum'
        description:
          type: string
        seat_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Position number within tier (e.g., 1 for President)
      required:
      - id
      - seat_number
      - tier
      - title
    RoleEnum:
      enum:
      - GENERAL
      - STATE
      - ZONAL
      - LGA
      - WARD
      type: string
      description: |-
        * `GENERAL` - General Member
        * `STATE` - State Executive
        * `ZONAL` - Zonal Excos
        * `LGA` - LGA Excos
        * `WARD` - Ward Leaders
    TelegramMembership:
      type: object
      properties:
        telegram_user_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          description: Permanent Telegram user ID. Never changes.
        telegram_username:
          type: string
          description: Telegram @username (may change — supplementary only)
          maxLength: 100
        telegram_status:
          $ref: '#/components/schemas/TelegramStatusEnum'
        is_verified:
          type: boolean
          description: True only when Telegram confirms active channel membership
        last_verified_at:
          type: string
          format: date-time
          nullable: true
        left_at:
          type: string
          format: date-time
          nullable: true
          description: When member was detected as having left the channel
      required:
      - telegram_user_id
    TelegramStatusEnum:
      enum:
      - creator
      - administrator
      - member
      - restricted
      - left
      - kicked
      - not_member
      type: string
      description: |-
        * `creator` - Creator
        * `administrator` - Administrator
        * `member` - Member
        * `restricted` - Restricted
        * `left` - Left
        * `kicked` - Kicked/Banned
        * `not_member` - Not a Member
    TierEnum:
      enum:
      - STATE
      - ZONAL
      - LGA
      - WARD
      type: string
      description: |-
        * `STATE` - State Executive
        * `ZONAL` - Zonal Excos
        * `LGA` - LGA Excos
        * `WARD` - Ward Leaders
    TokenObtainPair:
      type: object
      properties:
        username:
