          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
              required:
              - refresh
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      parameters:
      - in: header
        name: Authorization
        schema:
          type: string
        description: Bearer <access_token>
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
          description: ''
  /api/v1/auth/password-reset/:
