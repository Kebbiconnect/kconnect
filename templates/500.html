<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Something Went Wrong - KPN</title>
<style>
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f8f6; color:#17251c; }
    .wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 20px; box-sizing:border-box; }
    .card { max-width:520px; width:100%; text-align:center; border:1px solid #dce3de; border-radius:16px; background:#fff; padding:42px 36px; box-sizing:border-box; }
    .mark { width:78px; height:78px; margin:0 auto 22px; border-radius:50%; background:#fdf3e0; color:#a8740a; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:750; }
    .brand { font-size:13px; font-weight:700; letter-spacing:.16em; color:#a8740a; margin:0 0 8px; text-transform:uppercase; }
    h1 { font-size:27px; font-weight:750; line-height:1.25; margin:0 0 12px; }
    p { font-size:15px; line-height:1.65; color:#57635b; margin:0 0 14px; }
    .actions { margin-top:24px; }
    a.btn { display:inline-block; background:#176b36; color:#fff; text-decoration:none; font-weight:600; font-size:15px; padding:12px 22px; border-radius:6px; }
    a.btn:hover { background:#145b2e; }
</style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <div class="mark">!</div>
        <p class="brand">Kebbi Progressive Youth Network</p>
        <h1>Something Went Wrong</h1>
        <p>
            We are sorry — an unexpected error occurred on our side.
            Please try again in a little while.
        </p>
        <div class="actions">
            <a class="btn" href="/">Back to Home</a>
        </div>
    </div>
</div>
</body>
</html>
